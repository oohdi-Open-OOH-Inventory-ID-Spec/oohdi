services:
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: oohdi-website
    environment:
      OOHDI_HOST: "0.0.0.0"
      OOHDI_PORT: "8080"
    expose:
      - "8080"
    networks:
      - oohdi-net
    restart: unless-stopped

  fictional-registry:
    build:
      context: ./examples/fictional_registry
      dockerfile: Dockerfile
    container_name: fictional-oohdi-registry
    environment:
      OOHDI_HOST: "0.0.0.0"
      OOHDI_PORT: "8080"
    expose:
      - "8080"
    networks:
      - oohdi-net
    restart: unless-stopped

  sample-media-owner:
    build:
      context: ./examples/sample_media_owner
      dockerfile: Dockerfile
    container_name: sample-media-owner
    environment:
      OOHDI_HOST: "0.0.0.0"
      OOHDI_PORT: "8080"
    expose:
      - "8080"
    networks:
      - oohdi-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: oohdi-nginx
    depends_on:
      - website
      - fictional-registry
      - sample-media-owner
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    command: >
      /bin/sh -c "
      mkdir -p /etc/nginx/certs &&
      if [ ! -f /etc/nginx/certs/oohdi.crt ] || [ ! -f /etc/nginx/certs/oohdi.key ]; then
        openssl req -x509 -nodes -newkey rsa:2048 \
          -keyout /etc/nginx/certs/oohdi.key \
          -out /etc/nginx/certs/oohdi.crt \
          -days 365 \
          -subj '/CN=oohdi.org' \
          -addext 'subjectAltName=DNS:oohdi.org,DNS:www.oohdi.org,DNS:example-media-owner.oohdi.org,DNS:example-registry.oohdi.org';
      fi &&
      nginx -g 'daemon off;'
      "
    networks:
      - oohdi-net
    restart: unless-stopped

networks:
  oohdi-net:
    driver: bridge
